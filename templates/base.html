{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Saraswati Sanman Samaroh{% endblock %}</title>
    <meta name="description" content="Shree Akhil Bharatiya Kutch Kadva Patidar Sanatan Samaj Kheralu Ayojit Saraswati Sanman Samaroh">

    <link href="{% static 'css/style.css' %}" rel="stylesheet">

<body>
